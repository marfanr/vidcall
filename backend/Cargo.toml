[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
webrtc = "0.21.0"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
axum = "0.8.9"
serde = "1.0.229"
serde_json = "1.0.152"
validator = { version = "0.20", features = ["derive"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
dotenvy = "0.15"