[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
webrtc = "0.21.1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = {version = "0.8.9", features = ["ws"]}
serde = "1.0.229"
sonic-rs = "0.3"
validator = { version = "0.20", features = ["derive"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
tokio-postgres-rustls = "0.14.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
dotenvy = "0.15"
deadpool-postgres = "0.14.2"
uuid = { version = "1.0", features = ["v7", "serde"] }
async-trait = "0.1.92"
nanoid = "0.5.0"
dashmap = "7.0.0-rc2"
arc-swap = "1.9.3"
argon2 = "0.6.0"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
cookie = "0.18.2"
chrono = "0.4.45"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
opentelemetry = "0.26"
opentelemetry-otlp = { version = "0.26", features = ["tonic", "tokio"] }
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"] }
tracing-opentelemetry = "0.27"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
headers = "0.4.2"
jemalloc-ctl = "0.5.4"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
jemallocator = { version = "0.5.4", features = ["stats", "background_threads"] }
jemalloc-ctl = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

