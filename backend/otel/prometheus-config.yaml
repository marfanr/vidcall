global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: 'otel-collector-metrics'
    static_configs:
      - targets: ['otel-collector:8889']
    scrape_interval: 15s

  - job_name: 'vidcall-metrics'
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/bearer_token.env
    static_configs:
      - targets: ['host.docker.internal:8080']