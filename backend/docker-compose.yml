services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: patroni-etcd
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --initial-advertise-peer-urls=http://etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new
    volumes:
      - etcd-data:/etcd-data
    networks:
      - backend

  postgres:
    image: ghcr.io/zalando/spilo-18:4.1-p2
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      SCOPE: postgres-ha
      ETCD3_HOST: etcd:2379

      PGUSER_SUPERUSER: postgres
      PGPASSWORD_SUPERUSER: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

      PGUSER_ADMIN: admin
      PGPASSWORD_ADMIN: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}

      PGUSER_STANDBY: standby
      PGPASSWORD_STANDBY: ${REPLICATION_PASSWORD:?Set REPLICATION_PASSWORD}

      SSL_CERTIFICATE: ${SSL_CERTIFICATE:?Set SSL_CERTIFICATE}
      SSL_PRIVATE_KEY: ${SSL_PRIVATE_KEY:?Set SSL_PRIVATE_KEY}

      SPILO_CONFIGURATION: |
        postgresql:
          parameters:
            bg_mon.listen_address: 0.0.0.0

    ports:
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:8008:8008"
    volumes:
      - postgres-data:/home/postgres/pgdata
    depends_on:
      - etcd
    networks:
      - backend

  # backend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: vidcall-backend
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres}
  #     OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
  #     OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-vidcall-backend}
  #     OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
  #     OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
  #     OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-otlp}
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     - postgres
  #     - otel-collector
  #   networks:
  #     - backend
  #     - monitoring

  otel-collector:
    image: otel/opentelemetry-collector:0.114.0
    container_name: otel-collector
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
    depends_on:
      - tempo
      - loki
      - jaeger
    networks:
      - monitoring

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./otel/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.2.0
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/var/loki
    ports:
      - "3100:3100"
    networks:
      - monitoring

  jaeger:
    image: jaegertracing/all-in-one:1.59
    container_name: jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector HTTP (for receiving from otel-collector)
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./otel/prometheus-config.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./otel/bearer_token.env:/etc/prometheus/bearer_token.env:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.5.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: "publicDashboards"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - monitoring

networks:
  backend:
    driver: bridge

  monitoring:
    driver: bridge

volumes:
  etcd-data:
  postgres-data:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
